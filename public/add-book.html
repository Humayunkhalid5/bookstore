<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📚 BookStore</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="add-book.html">Add Book</a></li>
          <li class="nav-item">
            <a class="nav-link" href="cart.html">Cart <span id="cartCount" class="badge bg-warning text-dark">0</span></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2 class="mb-3">Add a New Book</h2>

        <div id="message"></div>

        <form id="bookForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="title" class="form-control">
            <div class="invalid-feedback">Title is required (min 2 characters).</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Author</label>
            <input type="text" id="author" class="form-control">
            <div class="invalid-feedback">Author is required.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Price ($)</label>
            <input type="number" id="price" class="form-control">
            <div class="invalid-feedback">Price must be greater than 0.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Category</label>
            <select id="category" class="form-select">
              <option value="">Choose...</option>
              <option>Fiction</option>
              <option>Technology</option>
              <option>History</option>
              <option>Self-Help</option>
              <option>Science</option>
            </select>
            <div class="invalid-feedback">Please select a category.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Image URL (optional)</label>
            <input type="text" id="image" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary w-100">Add Book</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/add-book.js"></script>
</body>
</html>
