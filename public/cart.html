<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📚 BookStore</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="add-book.html">Add Book</a></li>
          <li class="nav-item">
            <a class="nav-link active" href="cart.html">Cart <span id="cartCount" class="badge bg-warning text-dark">0</span></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h2 class="mb-3">Your Cart</h2>

    <div class="table-responsive">
      <table class="table align-middle bg-white">
        <thead class="table-dark">
          <tr><th>Book</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr>
        </thead>
        <tbody id="cartBody"></tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <h4>Total: $<span id="total">0</span></h4>
      <div>
        <button id="clearBtn" class="btn btn-outline-secondary">Clear Cart</button>
        <button id="checkoutBtn" class="btn btn-success">Checkout</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
